<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04040a">
<link rel="icon" type="image/x-icon" href="marselo.ico">
<title>Watch — MARSELO ANIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://graphql.anilist.co">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04040a;--surface:#0d0d16;--surface-2:#13131f;
  --border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.12);
  --accent:#ff7a1a;--accent-2:#ffb02e;--accent-light:#ff9a4d;--accent-dark:#e55f00;
  --accent-rgb:255,122,26;--accent2-rgb:255,176,46;
  --gold:#f4c430;--green:#39d98a;--text:#f0eee8;--muted:#8b8a99;--muted-2:#3a3944;
  --ease:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --glass:rgba(255,255,255,.055);--glass-blur:blur(18px) saturate(150%);
  --panel-shadow:0 24px 60px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.09);
  --radius:22px;--radius-sm:12px;--radius-xs:8px;--sidebar-w:360px
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
img{display:block}
:focus-visible{outline:2px solid rgba(var(--accent2-rgb),.8);outline-offset:3px;border-radius:8px}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted-2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em}

/* ── ambient background (same family as the home page) ── */
body::before{content:'';position:fixed;inset:-20%;z-index:-3;opacity:.55;pointer-events:none;background:radial-gradient(ellipse 80% 55% at 110% -10%,rgba(var(--accent2-rgb),.10),transparent 62%),radial-gradient(ellipse 65% 45% at -10% 100%,rgba(var(--accent-rgb),.08),transparent 62%)}
.bg-scene{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;contain:strict}
.bg-blob{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform;animation:drift 34s ease-in-out infinite}
.bg-blob.b1{width:50vw;height:50vw;top:-18%;right:-12%;background:radial-gradient(circle,rgba(var(--accent-rgb),.13),transparent 70%)}
.bg-blob.b2{width:42vw;height:42vw;bottom:-15%;left:-10%;animation-delay:-12s;animation-direction:reverse;background:radial-gradient(circle,rgba(var(--accent2-rgb),.13),transparent 70%)}
.bg-banner{position:absolute;inset:0;background:var(--banner) center 20%/cover no-repeat;opacity:0;filter:blur(40px) saturate(1.4);transform:scale(1.1);transition:opacity 1.6s var(--ease)}
.bg-banner.on{opacity:.22}
.bg-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,10,.3),rgba(4,4,10,.95) 70%)}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4vw,-3vh) scale(1.1)}}
body.fx-off .bg-blob{animation:none}
body.fx-off .bg-banner{display:none}

/* ── dock header ── */
header{position:sticky;top:14px;z-index:200;width:min(1500px,calc(100% - 28px));margin:14px auto 6px;height:60px;padding:0 10px 0 18px;display:flex;align-items:center;gap:14px;border-radius:999px;animation:hdrIn .9s var(--ease) .1s backwards}
header::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:rgba(12,12,24,.6);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);box-shadow:0 14px 40px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);transition:background .5s,box-shadow .5s}
header.scrolled::after{background:rgba(8,8,16,.8);box-shadow:0 22px 60px -14px rgba(0,0,0,.8),0 0 50px -24px rgba(var(--accent2-rgb),.6),inset 0 1px 0 rgba(255,255,255,.09)}
header::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 30%,rgba(var(--accent2-rgb),.5) 60%,rgba(var(--accent-rgb),.55) 80%,rgba(255,255,255,.06));background-size:260% 100%;animation:sheen 10s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes hdrIn{from{opacity:0;transform:translateY(-24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheen{to{background-position:260% 0}}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.logo-mark{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(var(--accent-rgb),.55));transition:transform .5s var(--ease-spring)}
.logo:hover .logo-mark{transform:scale(1.15) rotate(-8deg)}
.logo-text{font-family:'Bebas Neue';font-size:24px;letter-spacing:.06em;color:var(--text)}
.logo-text em,.f-logo em{color:var(--accent);font-style:normal}
.hdr-mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hdr-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hdr-ep{flex-shrink:0;font:800 10.5px 'Inter',sans-serif;letter-spacing:.06em;padding:4px 9px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--accent-light),var(--accent));box-shadow:0 6px 16px -8px rgba(var(--accent-rgb),.9)}
.hdr-right{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 15px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-decoration:none;white-space:nowrap;transition:border-color .25s,color .25s,background .25s,transform .35s var(--ease),box-shadow .3s}
.icon-btn svg{width:15px;height:15px;flex-shrink:0}
.icon-btn:hover{border-color:rgba(var(--accent-rgb),.5);color:var(--text);background:rgba(var(--accent-rgb),.12);transform:translateY(-1px);box-shadow:0 10px 24px -12px rgba(var(--accent-rgb),.7)}
.icon-btn.round{width:40px;padding:0}
.icon-btn.on{color:var(--accent-light);border-color:rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.16)}
.icon-btn.fav.on svg{fill:currentColor}
.icon-btn.danger:hover{border-color:rgba(229,72,77,.5);color:#ff8a8a;background:rgba(229,72,77,.12)}
@media(max-width:900px){header{width:calc(100% - 16px);margin:8px auto 4px;height:54px;padding:0 6px 0 12px;gap:8px}.logo-text{display:none}.icon-btn .lbl{display:none}.icon-btn{padding:0 12px}.hdr-ep{display:none}}

/* ── layout ── */
.watch-layout{display:grid;grid-template-columns:minmax(0,1fr) var(--sidebar-w);gap:20px;padding:16px 5vw 0;align-items:start;max-width:1600px;margin:0 auto;animation:fadeUp .7s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(max-width:1100px){.watch-layout{grid-template-columns:1fr;--sidebar-w:100%}}
@media(max-width:640px){.watch-layout{padding:10px 12px 0;gap:14px}}
.main-col{min-width:0}
.mobile-slot{display:none}
@media(max-width:1100px){.mobile-slot{display:block;margin-top:14px}.mobile-slot:empty{display:none}}

/* ── player ── */
.player-wrap{position:relative;aspect-ratio:16/9;width:100%;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:0 30px 80px -24px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.08),0 0 60px -20px rgba(var(--accent-rgb),.25);transition:box-shadow .5s var(--ease),aspect-ratio .4s var(--ease)}
.player-wrap.playing{box-shadow:0 30px 80px -24px rgba(0,0,0,.95),0 0 0 1px rgba(var(--accent-rgb),.35),0 0 80px -16px rgba(var(--accent-rgb),.45)}
.player-wrap iframe{width:100%;height:100%;border:0;position:absolute;inset:0;transition:opacity .25s}
.player-loader{position:absolute;inset:0;z-index:10;background:rgba(6,6,12,.9);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s var(--ease)}
.player-loader.gone{opacity:0;pointer-events:none}
.spinner{width:40px;height:40px;border:2.5px solid rgba(var(--accent-rgb),.15);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 24px -6px rgba(var(--accent-rgb),.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-label{font-size:12px;color:var(--muted);font-weight:500}
.loader-label b{color:var(--text);font-weight:600}
.upnext{position:absolute;right:16px;bottom:16px;z-index:12;display:none;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:16px;background:rgba(10,10,20,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 50px -20px rgba(0,0,0,.9);animation:fadeUp .4s var(--ease) both}
.upnext.show{display:flex}
.upnext .ring{position:relative;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center;font:800 12px 'Inter',sans-serif;flex-shrink:0}
.upnext .ring::before{content:'';position:absolute;inset:3px;border-radius:50%;background:rgba(10,10,20,.95)}
.upnext .ring span{position:relative}
.upnext .txt{min-width:0}
.upnext .txt small{display:block;font:700 9.5px 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.upnext .txt b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.upnext .btn{padding:8px 12px;font-size:12px}
@media(max-width:640px){.upnext{left:10px;right:10px;bottom:10px}.upnext .txt b{max-width:none}}

/* ── control bar ── */
.panel{background:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),rgba(14,14,28,.3);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-radius:var(--radius);box-shadow:var(--panel-shadow)}
.ctrl-bar{padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ctrl-left{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:1;min-width:0}
.ctrl-right{display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap;position:relative;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,border-color .3s,color .3s,filter .3s}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--accent-light),var(--accent) 55%,var(--accent-dark));color:#fff;box-shadow:0 10px 26px -10px rgba(var(--accent-rgb),.85),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 16px 36px -10px rgba(var(--accent-rgb),.95)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-ghost:hover{border-color:rgba(var(--accent-rgb),.55);background:rgba(var(--accent-rgb),.12);color:var(--accent-light);transform:translateY(-1px)}
.btn-toggle{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.btn-toggle:hover{border-color:var(--border-hover);color:var(--text)}
.btn-toggle.on{background:rgba(57,217,138,.12);color:var(--green);border-color:rgba(57,217,138,.35)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;filter:none!important}
.telemetry{font-size:11px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);padding:7px 12px;border-radius:999px;display:flex;gap:14px;align-items:center;font-family:ui-monospace,monospace;white-space:nowrap}
.telemetry span{color:var(--accent-light);font-weight:700}
.telemetry .st.playing{color:var(--green)}
@media(max-width:640px){
  .ctrl-bar{padding:10px;gap:8px}
  .ctrl-left{gap:6px}
  .btn .lbl{display:none}
  .btn{padding:9px 12px}
  .btn-primary .lbl{display:inline}
  .ctrl-right{width:100%}
  .telemetry{width:100%;justify-content:space-between}
  #ctrl-shortcuts,#ctrl-theater{display:none}
}

/* ── server + format row ── */
.stream-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.srv-select-wrap{position:relative;flex-shrink:0}
.srv-select-wrap::after{content:'';position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.srv-select{appearance:none;-webkit-appearance:none;height:40px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:0 36px 0 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:160px;transition:border-color .25s,box-shadow .25s}
.srv-select:hover{border-color:rgba(var(--accent-rgb),.5)}
.srv-select:focus{outline:none;border-color:rgba(var(--accent2-rgb),.6);box-shadow:0 0 0 4px rgba(var(--accent2-rgb),.12)}
.srv-select option{background:#12121f}
.fmt-group{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.fmt-btn{padding:7px 15px;border-radius:999px;font:800 12px 'Inter',sans-serif;letter-spacing:.08em;color:var(--muted);transition:background .3s,color .3s}
.fmt-btn.on{background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#fff;box-shadow:0 6px 16px -8px rgba(var(--accent-rgb),.9)}
.stream-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
@media(max-width:640px){.stream-actions{margin-left:0;width:100%}.stream-actions .icon-btn{flex:1}.srv-select-wrap{flex:1}.srv-select{width:100%}}

/* ── next-ep timer ── */
.next-ep-timer{background:linear-gradient(135deg,rgba(var(--accent-rgb),.18),rgba(255,255,255,.03));border:1px solid rgba(var(--accent-rgb),.35);border-radius:14px;padding:11px 14px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.next-ep-timer.hidden{display:none}
.timer-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.8s ease-in-out infinite;flex-shrink:0}
.timer-body{flex:1;min-width:0}
.timer-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);margin-bottom:2px}
.timer-display{font-family:ui-monospace,monospace;font-size:20px;font-weight:800;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.timer-sub{font-size:11px;color:var(--muted);margin-top:2px}
.timer-sub strong{color:var(--text);font-weight:600}

/* ── anime info ── */
.anime-info{margin-top:20px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;padding:22px}
@media(max-width:640px){.anime-info{grid-template-columns:1fr;gap:14px;padding:16px}}
.anime-poster{width:128px;border-radius:16px;overflow:hidden;flex-shrink:0;background:var(--surface-2);box-shadow:0 20px 40px -16px rgba(0,0,0,.8),0 0 40px -14px rgba(var(--accent-rgb),.45)}
.anime-poster img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover}
@media(max-width:640px){.anime-poster{width:92px}}
.anime-title{font-family:'Bebas Neue';font-size:36px;line-height:1.02;letter-spacing:.02em;margin-bottom:4px;color:var(--text)}
.anime-alt{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap}
.anime-alt .studio{color:var(--accent);font-weight:700}
@media(max-width:640px){.anime-title{font-size:28px}}
.anime-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font:600 11.5px 'Inter',sans-serif;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.1);color:#d6d4dd;background:rgba(255,255,255,.07)}
.tag.score{color:var(--gold);border-color:rgba(244,196,48,.35)}
.tag.score svg{width:11px;height:11px;fill:var(--gold)}
.tag.live{color:var(--green);border-color:rgba(57,217,138,.35)}
.tag.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 1.6s infinite}
.tag.genre{cursor:pointer;transition:background .25s,border-color .25s}
.tag.genre:hover{background:rgba(var(--accent-rgb),.2);border-color:rgba(var(--accent-rgb),.5)}
.anime-desc{font-size:13.5px;line-height:1.75;color:#c9c7cf;max-width:80ch}
.anime-desc.truncated{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc-toggle{color:var(--accent-2);font:700 12px 'Inter',sans-serif;margin-top:8px;padding:0}
.desc-toggle:hover{text-decoration:underline}
.d-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:16px}
.stat-block{border-radius:14px;padding:10px 14px;border:1px solid rgba(var(--accent-rgb),.2);background:linear-gradient(160deg,rgba(var(--accent-rgb),.13),rgba(255,255,255,.03))}
.stat-block strong{display:block;font-family:'Bebas Neue';font-size:20px;color:var(--accent-light);line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-block span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ── sections ── */
.sec{margin-top:16px;padding:22px}
@media(max-width:640px){.sec{padding:16px}}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.section-title{font-family:'Bebas Neue';font-size:22px;letter-spacing:.04em;color:var(--text);display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.section-sub{font-size:11.5px;color:var(--muted)}

/* voice cast */
.va-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px}
.va-card{text-align:center}
.va-avatar-wrap{position:relative;width:66px;height:66px;margin:0 auto 8px;border-radius:50%;overflow:visible;transition:transform .35s var(--ease)}
.va-avatar-wrap>img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.1);background:var(--surface-2);transition:border-color .25s,box-shadow .25s}
.va-card:hover .va-avatar-wrap{transform:translateY(-3px)}
.va-card:hover .va-avatar-wrap>img{border-color:rgba(var(--accent-rgb),.6);box-shadow:0 0 18px -4px rgba(var(--accent-rgb),.5)}
.char-avatar{position:absolute;bottom:-3px;right:-3px;width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);overflow:hidden;background:var(--surface-2)}
.char-avatar img{width:100%;height:100%;object-fit:cover}
.va-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va-char{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,var(--muted-2) 50%,var(--surface-2) 70%);background-size:200% 100%;animation:shimmer 1.8s var(--ease) infinite;border-radius:14px;border:1px solid var(--border)}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-150% 0}}
.va-skel{width:66px;height:66px;border-radius:50%;margin:0 auto 8px}
.va-skel-name{height:10px;border-radius:4px;width:60%;margin:0 auto}

/* suggestions */
.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media(max-width:640px){.sug-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}}
.sug-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .35s var(--ease),border-color .25s,box-shadow .35s}
.sug-card:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-5px);box-shadow:0 18px 40px -14px rgba(var(--accent-rgb),.6)}
.sug-poster{width:100%;aspect-ratio:2/3;overflow:hidden;position:relative;background:var(--sc,var(--surface-2))}
.sug-poster img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.sug-card:hover .sug-poster img{transform:scale(1.06)}
.sug-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,13,.92),transparent 55%)}
.sug-score{position:absolute;top:8px;right:8px;background:rgba(7,7,13,.8);backdrop-filter:blur(8px);color:var(--gold);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;border:1px solid rgba(244,196,48,.22)}
.sug-body{padding:10px 11px}
.sug-title{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;transition:color .2s}
.sug-card:hover .sug-title{color:var(--accent)}
.sug-sub{font-size:10.5px;color:var(--muted)}
.skel-card{aspect-ratio:2/3}

/* ── sidebar ── */
.sidebar{display:flex;flex-direction:column;gap:14px;position:sticky;top:88px;max-height:calc(100vh - 100px);overflow-y:auto;scrollbar-width:thin;padding-right:2px}
@media(max-width:1100px){.sidebar{position:static;max-height:none;overflow:visible}}
.sb-panel{padding:18px}
.sb-title{font-family:'Bebas Neue';font-size:17px;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ep-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ep-search{flex:1;min-width:0;height:38px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--text);padding:0 12px;border-radius:12px;font-size:12.5px;transition:border-color .25s,box-shadow .25s}
.ep-search::placeholder{color:var(--muted)}
.ep-search:focus{outline:none;border-color:rgba(var(--accent2-rgb),.6);box-shadow:0 0 0 4px rgba(var(--accent2-rgb),.12)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--border);flex-shrink:0}
.seg button{width:34px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--muted);transition:background .3s,color .3s}
.seg button svg{width:14px;height:14px}
.seg button.on{background:linear-gradient(135deg,var(--accent-light),var(--accent));color:#fff}
.ep-range{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ep-range button{font:700 11px 'Inter',sans-serif;padding:5px 10px;border-radius:999px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:color .2s,background .2s,border-color .2s}
.ep-range button.on,.ep-range button:hover{color:#fff;background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.5)}
.ep-count{font:600 11px 'Inter',sans-serif;color:var(--muted);letter-spacing:0;text-transform:none}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:300px;overflow-y:auto;padding:2px;scrollbar-width:thin}
.ep-grid.thumbs{grid-template-columns:1fr 1fr;max-height:420px}
@media(max-width:1100px){.ep-grid{max-height:260px}.ep-grid.thumbs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:360px}}
.ep-btn{position:relative;height:40px;border-radius:10px;font:700 12px 'Inter',sans-serif;color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);transition:transform .3s var(--ease),background .25s,border-color .25s,box-shadow .3s}
.ep-btn:hover{transform:translateY(-2px);background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.55);box-shadow:0 10px 22px -12px rgba(var(--accent-rgb),.8)}
.ep-btn:active{transform:scale(.96)}
.ep-btn.seen{color:var(--muted);background:rgba(255,255,255,.03)}
.ep-btn.prog::after{content:'';position:absolute;left:8px;right:8px;bottom:5px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(57,217,138,.85) calc(var(--p,0)*1%),rgba(255,255,255,.14) 0)}
.ep-btn.on.prog::after{background:linear-gradient(90deg,#fff calc(var(--p,0)*1%),rgba(0,0,0,.25) 0)}
.ep-btn.on{background:linear-gradient(135deg,var(--accent-light),var(--accent));border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px rgba(var(--accent-rgb),.9)}
.ep-btn.soon{color:var(--muted);border-style:dashed;cursor:default}
.ep-btn.soon:hover{transform:none;background:rgba(255,255,255,.04);box-shadow:none;border-color:rgba(255,255,255,.12)}
.ep-btn.hidden{display:none}
.ep-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:transform .35s var(--ease),border-color .25s,box-shadow .35s;text-align:left}
.ep-card:hover{transform:translateY(-2px);border-color:rgba(var(--accent-rgb),.5)}
.ep-card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2)}
.ep-card .n{position:absolute;top:6px;left:6px;font:800 10px 'Inter',sans-serif;padding:3px 7px;border-radius:6px;background:rgba(7,7,13,.8);border:1px solid rgba(255,255,255,.1);color:#fff}
.ep-card .t{padding:7px 9px;font:600 11px/1.35 'Inter',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.ep-card.on{border-color:rgba(var(--accent-rgb),.7);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.4),0 10px 24px -12px rgba(var(--accent-rgb),.8)}
.ep-card.seen .t{color:var(--muted)}
.ep-card.hidden{display:none}
.ep-card.prog::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,rgba(57,217,138,.9) calc(var(--p,0)*1%),rgba(255,255,255,.14) 0)}
.ep-card.on.prog::after{background:linear-gradient(90deg,var(--accent-2) calc(var(--p,0)*1%),rgba(255,255,255,.14) 0)}
.ep-card.soon{opacity:.45;cursor:default}
.ep-card.soon:hover{transform:none;border-color:rgba(255,255,255,.08)}

/* seasons */
.seasons-list{display:flex;flex-direction:column;gap:8px}
.season-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .3s var(--ease),border-color .25s,background .25s;display:flex;gap:11px;align-items:center}
.season-card:hover{border-color:rgba(var(--accent-rgb),.45);transform:translateX(3px);background:rgba(255,255,255,.08)}
.season-card.on{border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.12);cursor:default}
.season-card.on:hover{transform:none}
.season-thumb{width:40px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface-2)}
.season-info{flex:1;min-width:0}
.season-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.season-card:hover .season-name,.season-card.on .season-name{color:var(--accent-light)}
.season-meta{font-size:10.5px;color:var(--muted);display:flex;gap:6px}
.season-badge{font:800 9px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.3);color:var(--accent-light);flex-shrink:0;white-space:nowrap}
.no-seasons{text-align:center;padding:20px 12px;color:var(--muted);font-size:12.5px;line-height:1.65}

/* ── modal ── */
.modal-bg{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(70% 70% at 50% 40%,rgba(30,20,50,.35),rgba(3,3,8,.62));backdrop-filter:blur(16px) saturate(130%)}
.modal-bg.open{display:flex;animation:mfade .3s var(--ease) both}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.025) 55%),rgba(14,14,28,.5);backdrop-filter:blur(34px) saturate(190%);border-radius:24px;padding:28px;max-width:420px;width:100%;box-shadow:0 50px 100px -30px rgba(0,0,0,.8),0 0 80px -30px rgba(var(--accent-rgb),.4),inset 0 1px 0 rgba(255,255,255,.12);animation:wIn .6s var(--ease) both}
@keyframes wIn{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.modal-card h3{font-family:'Bebas Neue';font-size:26px;letter-spacing:.03em;margin-bottom:14px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.modal-row:last-of-type{border-bottom:none}
kbd{background:var(--bg);border:1px solid var(--border-hover);border-radius:5px;padding:3px 8px;color:var(--text);font-family:ui-monospace,monospace;font-size:11px;font-weight:700}

/* ── toasts ── */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(19,19,31,.85);backdrop-filter:blur(16px);border:1px solid var(--border-hover);color:var(--text);padding:12px 16px 12px 18px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px;min-width:240px;max-width:360px;animation:tslide .5s var(--ease-spring),tfade .4s var(--ease) var(--tlife,2.9s) forwards}
.toast.ok{border-color:rgba(0,200,83,.4)}
.toast.err{border-color:rgba(229,72,77,.5)}
.toast svg{width:16px;height:16px;flex-shrink:0}
.toast span{flex:1}
.toast button{font:700 12px 'Inter',sans-serif;color:var(--accent-2);padding:5px 10px;border-radius:8px;background:rgba(var(--accent-rgb),.12)}
.toast button:hover{background:rgba(var(--accent-rgb),.3)}
@keyframes tslide{from{transform:translateY(18px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes tfade{to{opacity:0;transform:translateY(10px) scale(.94)}}
@media(max-width:600px){.toast-wrap{left:14px;right:14px;bottom:14px}.toast{min-width:0;max-width:none}}

/* ── states ── */
.error-view{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px}
.error-view svg{width:48px;height:48px;color:var(--muted-2)}
.error-view h2{font-family:'Bebas Neue';font-size:30px;color:var(--muted);letter-spacing:.04em}
.error-view p{color:var(--muted);font-size:13px;max-width:300px;line-height:1.65}

/* ── theater / lights ── */
body.theater .watch-layout{grid-template-columns:1fr;max-width:1900px}
body.theater .sidebar{display:none}
body.theater .player-wrap{aspect-ratio:21/9}
@media(max-width:1100px){body.theater .player-wrap{aspect-ratio:16/9}}
.lights-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
body.lights-on .lights-overlay{opacity:1}
.player-wrap{position:relative;z-index:1}
body.lights-on .player-wrap{z-index:170}
body.lights-on header{opacity:.35}
body.lights-on .watch-layout{position:relative;z-index:170}
body.lights-on .main-col>*:not(.player-wrap):not(.ctrl-bar),body.lights-on .sidebar{opacity:.06;pointer-events:none}
body.lights-on .ctrl-bar{opacity:.5}

/* ── motion + performance layer ── */
.bg-blob{filter:none}
body.anim-paused .bg-blob,body.anim-paused header::before{animation-play-state:paused}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
.stg>*{animation:popIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
.sug-card:active,.season-card:active,.ep-card:active{transform:scale(.975)}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.32);transform:scale(0);animation:rippleOut .65s var(--ease) forwards}
@keyframes rippleOut{to{transform:scale(1);opacity:0}}

@media (hover:none),(pointer:coarse){
  .stg>*{animation-delay:calc(var(--i,0)*16ms);animation-duration:.4s}
  .rv{transition-duration:.45s}
  .sug-card:hover{transform:none;box-shadow:none;border-color:rgba(255,255,255,.08)}
  .sug-card:hover .sug-poster img{transform:none}
  .ep-btn:hover{transform:none;box-shadow:none}
  .sug-card:active,.season-card:active,.ep-card:active,.ep-btn:active{transform:scale(.97)}
}

/* ── footer ── */
footer{margin-top:70px;border-top:1px solid var(--border);padding:28px 5vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--surface)}
.f-logo{font-family:'Bebas Neue';font-size:19px;letter-spacing:.06em;color:var(--muted)}
footer p{font-size:11.5px;color:var(--muted)}
footer nav a{font-size:11.5px;color:var(--muted);text-decoration:none;margin-left:16px;transition:color .2s}
footer nav a:hover{color:var(--text)}
.to-top{position:fixed;right:22px;bottom:22px;z-index:230;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(12,12,24,.7);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .35s,transform .45s var(--ease),background .25s}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top svg{width:16px;height:16px}
.to-top:hover{background:rgba(var(--accent-rgb),.3)}
.toast-wrap:has(.toast)~.to-top{transform:translateY(-64px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   MARSELO ANIME · watch page
   Shares settings (macfg), favourites (maf), history (mwh),
   continue-watching (mcw) and watched sets (mwe_<id>) with index.html
   ═══════════════════════════════════════════════════════════ */
const params  = new URLSearchParams(location.search);
const ANIME_ID= parseInt(params.get('id'))||null;
const START_EP= parseInt(params.get('ep'))||1;
const LOGO='marselo.ico';
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;

/* ── shared settings from the home page ── */
const cfg=Object.assign({autoplay:true,autonext:true,lang:'english',hideAdult:false,fx:true,accent:'orange'},ls.get('macfg',{}));
const ACCENTS={orange:['#ff7a1a','#ffb02e'],red:['#ff3b5c','#ff8a9a'],violet:['#8b5cf6','#c4a3ff'],cyan:['#06b6d4','#7de3f4'],green:['#22c55e','#8ef0b0'],pink:['#ec4899','#ffa6d0']};
const hexRgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const mix=(h,t,p)=>{const a=hexRgb(h);return'#'+a.map(c=>Math.round(c+(t-c)*p).toString(16).padStart(2,'0')).join('')};
(function(){const[a,b]=ACCENTS[cfg.accent]||ACCENTS.orange,r=document.documentElement.style;r.setProperty('--accent',a);r.setProperty('--accent-2',b);r.setProperty('--accent-rgb',hexRgb(a).join(', '));r.setProperty('--accent2-rgb',hexRgb(b).join(', '));r.setProperty('--accent-light',mix(a,255,.22));r.setProperty('--accent-dark',mix(a,0,.18))})();
document.body.classList.toggle('fx-off',!cfg.fx);
const T=m=>{const t=(m&&m.title)||{};if(cfg.lang==='romaji')return t.romaji||t.english||t.native||'';if(cfg.lang==='native')return t.native||t.romaji||t.english||'';return t.english||t.romaji||t.native||''};

let curEp          = START_EP;
let totalEps       = 12;
let airedEps       = 0;
let gateEps        = false;
let fmt            = localStorage.getItem('player_fmt')||'sub';
let server         = localStorage.getItem('player_server')||'tryembed';
let animeData      = null;
let allSeasons     = [];
let cfgAutoplay    = cfg.autoplay!==false;
let cfgAutoNext    = localStorage.getItem('cfg_autonext')!=null?ls.get('cfg_autonext',true):cfg.autonext!==false;
let timerInterval  = null;
let lastCt=0,lastDur=0,lastSave=0,lastCw=0,resumeOffered=false,upnextTimer=null;
let favorites=ls.get('maf',[]);

/* ── AniList ── */
const GQL = `query($id:Int){Page(page:1,perPage:1){media(id:$id,type:ANIME){
  id idMal title{english romaji native} description isAdult format status duration
  coverImage{large extraLarge color} bannerImage
  averageScore popularity favourites episodes season seasonYear genres
  studios(isMain:true){nodes{name}}
  nextAiringEpisode{episode airingAt}
  streamingEpisodes{title thumbnail}
  relations{edges{relationType node{id type format title{english romaji native}coverImage{large color}averageScore episodes season seasonYear}}}
  characters(sort:[ROLE,RELEVANCE],perPage:16){edges{role node{id name{full}image{large}}voiceActors(language:JAPANESE,sort:RELEVANCE){id name{full}image{large}}}}

async function gql(q,vars){
  for(let i=0;i<3;i++){
    try{
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:q,variables:vars})});
      if(r.status===429){await new Promise(res=>setTimeout(res,Math.min((+r.headers.get('Retry-After')||5)*1000,15000)));continue}
      const j=await r.json();
      return (j&&j.data&&j.data.Page&&j.data.Page.media)||[];
    }catch{await new Promise(res=>setTimeout(res,700*(i+1)))}
  }
  return[];
}

function toast(msg,type='info',action){
  const c=$('toasts'),t=document.createElement('div');
  t.className=`toast ${type}`;
  const icon=type==='ok'?`<svg viewBox="0 0 24 24" fill="none" stroke="#00c853" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
    :type==='err'?`<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>`
    :`<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
  const life=action?7000:2900;
  t.style.setProperty('--tlife',life+'ms');
  t.innerHTML=`${icon}<span>${esc(msg)}</span>${action?`<button type="button">${esc(action.label)}</button>`:''}`;
  if(action)t.querySelector('button').onclick=()=>{action.fn();t.remove()};
  c.appendChild(t);setTimeout(()=>t.remove(),life+450);
  return t;
}

function updateTimer(targetDate){
  const update=()=>{
    const dist=targetDate-Date.now();
    if(dist<0){clearInterval(timerInterval);const el=$('next-ep-timer');if(el)el.classList.add('hidden');return}
    const days=Math.floor(dist/86400000),h=Math.floor((dist%86400000)/3600000),m=Math.floor((dist%3600000)/60000),s=Math.floor((dist%60000)/1000);
    const el=$('timer-countdown');
    if(el)el.textContent=days>0?`${days}d ${pad(h)}h ${pad(m)}m`:h>0?`${pad(h)}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;
  };
  update();clearInterval(timerInterval);timerInterval=setInterval(update,1000);
}
function initTimer(a){
  const el=$('next-ep-timer');
  if(!el||!a.nextAiringEpisode||!a.nextAiringEpisode.airingAt){if(el)el.classList.add('hidden');return}

}

function stagger(c){if(!c)return;[...c.children].slice(0,40).forEach((k,i)=>k.style.setProperty('--i',i));c.classList.remove('stg');void c.offsetWidth;c.classList.add('stg')}
function revealPanels(){
  const els=document.querySelectorAll('.anime-info,.sec');if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -30px 0px'});
  els.forEach(el=>{el.classList.add('rv');io.observe(el)});
}

/* ── Episodes ── */
const CH=100;
let epMode='thumbs',epRange=null;
function thumbsMap(){
  const m=new Map();
  ((animeData&&animeData.streamingEpisodes)||[]).forEach(s=>{const r=/(?:episode|ep\.?)\s*(\d+)/i.exec(s.title||'');if(r&&s.thumbnail&&!m.has(+r[1]))m.set(+r[1],s)});
  return m;
}
function buildEpGrid(){
  const g=$('ep-grid');if(!g)return;
  const thumbs=thumbsMap();
  if(!$('ep-mode'))epMode='grid';
  if(epRange==null)epRange=Math.floor((curEp-1)/CH);
  const chunks=Math.ceil(totalEps/CH);
  const rg=$('ep-range');
  rg.innerHTML=chunks>1?Array.from({length:chunks},(_,i)=>`<button data-r="${i}" class="${i===epRange?'on':''}">${i*CH+1}–${Math.min(totalEps,(i+1)*CH)}</button>`).join(''):'';
  rg.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{epRange=+b.dataset.r;buildEpGrid()});
  g.classList.toggle('thumbs',epMode==='thumbs');
  g.innerHTML='';
  const seen=getWatched(),posMap=ls.get(posKey(),{});
  const from=epRange*CH+1,to=Math.min(totalEps,from+CH-1);
  const frag=document.createDocumentFragment();
  for(let i=from;i<=to;i++){
    const isActive=i===curEp,isSeen=seen.has(i)&&!isActive,soon=gateEps&&i>airedEps;
    const s=thumbs.get(i);
    const b=document.createElement('button');
    b.dataset.ep=i;
    if(epMode==='thumbs'&&s){
      b.className=`ep-card${isActive?' on':isSeen?' seen':''}${soon?' soon':''}`;
      b.innerHTML=`<img src="${esc(s.thumbnail)}" alt="" loading="lazy" decoding="async"><span class="n">EP ${i}${soon?' · soon':''}</span><div class="t">${esc((s.title||'').replace(/^episode\s*\d+\s*[-–:]\s*/i,''))}</div>`;
      if(soon)b.disabled=true;
    }else{
      b.className=`ep-btn${isActive?' on':isSeen?' seen':''}${soon?' soon':''}`;
      b.textContent=pad(i);
      if(soon)b.disabled=true;
    }
    if(!soon)setProg(b,epPct(i,isSeen,posMap));
    b.title=soon?`Episode ${i} — not aired yet`:`Episode ${i}${isSeen?' — Watched':''}`;
    if(!soon)b.addEventListener('click',()=>goEp(i));
    frag.appendChild(b);
  }
  g.appendChild(frag);
  if(!window.__epStg){window.__epStg=1;stagger(g)}
  scrollEpIntoView();
  const f=$('ep-filter');if(f&&f.value)f.dispatchEvent(new Event('input'));
  const c=$('ep-count');if(c)c.textContent=`${seen.size?seen.size+' watched · ':''}${totalEps} total`;
}
function scrollEpIntoView(){const g=$('ep-grid'),on=g&&g.querySelector('.on');if(!on)return;const top=on.getBoundingClientRect().top-g.getBoundingClientRect().top+g.scrollTop;g.scrollTop=Math.max(0,top-g.clientHeight/2+on.offsetHeight/2)}

  if(allSeasons.length<=1){list.innerHTML=`<div class="no-seasons">No other seasons or related series found.</div>`;return}
  list.innerHTML='';
  allSeasons.forEach(s=>{
    const card=document.createElement('div');card.className=`season-card${s.current?' on':''}`;
    const seasonLabel=s.season&&s.year?`${cap(s.season)} ${s.year}`:s.year||'';
    const relLabel=s.rel?s.rel.replace(/_/g,' '):'';
    card.innerHTML=`${s.cover?`<img class="season-thumb" src="${esc(s.cover)}" loading="lazy" decoding="async" alt="" style="background:${esc(s.color||'var(--surface-2)')}">`:`<div class="season-thumb"></div>`}<div class="season-info"><div class="season-name">${esc(s.title)}</div><div class="season-meta">${seasonLabel?`<span>${esc(seasonLabel)}</span>`:''}${s.eps?`<span>${s.eps} eps</span>`:''}${s.score?`<span>★ ${s.score}%</span>`:''}</div></div>${s.current?'<span class="season-badge">Now</span>':relLabel?`<span class="season-badge">${esc(relLabel)}</span>`:''}`;
    if(!s.current)card.addEventListener('click',()=>{window.location.href=`watch?id=${s.id}&ep=1`});
    list.appendChild(card);
  });
  stagger(list);
}

/* ── Watched / progress ── */
function watchedKey(){return`mwe_${ANIME_ID}`}
function getWatched(){
  return new Set(ls.get(watchedKey(),[]));
}
function markWatched(ep){const s=new Set(ls.get(watchedKey(),[]));s.add(ep);ls.set(watchedKey(),[...s])}
const posKey=()=>`mpos_${ANIME_ID}`;
function savePos(ct,dur){const p=ls.get(posKey(),{});p[curEp]=[Math.floor(ct),Math.floor(dur)];ls.set(posKey(),p);const b=document.querySelector(`#ep-grid [data-ep="${curEp}"]`);if(b)setProg(b,epPct(curEp,false,p))}
function epPct(ep,seenDone,posMap){
  const p=posMap[ep];
  if(p&&p[1]&&p[0]){const r=p[0]/p[1]*100;return r>=85?100:Math.max(3,Math.round(r))}
  return seenDone?100:0;
}
function setProg(b,pct){b.classList.toggle('prog',pct>0);b.style.setProperty('--p',pct)}
function getPos(ep){const p=ls.get(posKey(),{});return p[ep]||null}
function updateCwProgress(ct,dur){
  if(!dur)return;
  const cw=ls.get('mcw',[]);const i=cw.findIndex(x=>+x.animeId===ANIME_ID);
  if(i>-1){cw[i].progress=Math.round(ct/dur*100);cw[i].episode=curEp;cw[i].ts=Date.now();ls.set('mcw',cw)}
}
function offerResume(){
  if(resumeOffered)return;resumeOffered=true;
  const p=getPos(curEp);if(!p)return;
  const[t,d]=p;if(t<45||(d&&t/d>.92))return;
  toast(`Resume from ${fmtClock(t)}?`,'info',{label:'Resume',fn:()=>seekPlayer(t)});
}

/* ── Navigation ── */
function goEp(ep){
  if(ep===curEp)return;
  hideUpnext();
  curEp=ep;resumeOffered=false;lastCt=0;lastDur=0;
  if(Math.floor((ep-1)/CH)!==epRange){epRange=Math.floor((ep-1)/CH);buildEpGrid()}else updateEpBtns();
  reloadPlayer();
  $('meta-ep').textContent=pad(ep);$('hdr-ep').textContent=`EP ${pad(ep)}`;
  document.title=`${T(animeData)} — EP ${pad(ep)} · MARSELO ANIME`;
  history.replaceState(null,'',`?id=${ANIME_ID}&ep=${ep}`);
  toast(`Episode ${pad(ep)}`,'info');
  saveHistory(animeData);
  if(animeData)initComments(animeData);
  if(!matchMedia('(max-width:1100px)').matches||window.scrollY>300)window.scrollTo({top:0,behavior:'smooth'});
}
function updateEpBtns(){
  const seen=getWatched(),posMap=ls.get(posKey(),{});
  document.querySelectorAll('#ep-grid [data-ep]').forEach(b=>{
    const ep=+b.dataset.ep,isActive=ep===curEp,isSeen=seen.has(ep)&&!isActive;
    b.classList.toggle('on',isActive);b.classList.toggle('seen',isSeen);
    if(!b.classList.contains('soon'))setProg(b,epPct(ep,isSeen,posMap));
    if(!b.classList.contains('soon'))b.title=`Episode ${ep}${isSeen?' — Watched':''}`;
  });
  scrollEpIntoView();
  const c=$('ep-count');if(c)c.textContent=`${seen.size?seen.size+' watched · ':''}${totalEps} total`;
  const p=$('ctrl-prev'),n=$('ctrl-next');
  if(p)p.disabled=curEp<=1;if(n)n.disabled=curEp>=totalEps||(gateEps&&curEp>=airedEps);
}
function reloadPlayer(){
  const f=$('player'),l=$('ploading');if(!f)return;
  f.style.opacity='0.4';
  setTimeout(()=>{if(l)l.classList.remove('gone');f.src=embedUrl(ANIME_ID,curEp,fmt,server);f.style.opacity='1'},150);
  const s=$('meta-status');if(s){s.textContent='Buffering';s.className='st'}
  const srv=$('loader-srv');if(srv)srv.textContent=(SERVERS.find(x=>x.id===server)||{}).label?.replace(/[^\w ]/g,'').trim()||'stream';
  const w=$('pwrap');if(w)w.classList.remove('playing');
  const mt=$('meta-time');if(mt)mt.style.display='none';
}
function seekPlayer(abs){
  const f=$('player');if(!f||!f.contentWindow)return;
  if(server==='tryembed'){
    f.contentWindow.postMessage(JSON.stringify({command:'seek',time:abs}),'*');
    f.contentWindow.postMessage({command:'seek',time:abs},'*');
  }else{
    const base=embedUrl(ANIME_ID,curEp,fmt,server);
    f.src=base+(base.includes('?')?'&':'?')+'startAt='+Math.floor(abs);
    const l=$('ploading');if(l)l.classList.remove('gone');
  }
}
function cmd(c,v){
  const f=$('player');if(!f||!f.contentWindow)return;
  const p={command:c,event:c};if(c==='seek'&&v!=null)p.time=v;
  f.contentWindow.postMessage(JSON.stringify(p),'*');f.contentWindow.postMessage(p,'*');
}

/* ── Up next overlay ── */
function showUpnext(){
  const el=$('upnext');if(!el)return;
  const nextTitle=`Episode ${pad(curEp+1)}`;
  $('upnext-title').textContent=nextTitle;
  el.classList.add('show');
  let n=8;const ring=$('upnext-ring'),lab=$('upnext-n');
  const tick=()=>{lab.textContent=n;ring.style.setProperty('--p',((8-n)/8*100).toFixed(1));if(n<=0){hideUpnext();goEp(curEp+1);return}n--;upnextTimer=setTimeout(tick,1000)};
  clearTimeout(upnextTimer);tick();
}
function hideUpnext(){clearTimeout(upnextTimer);const el=$('upnext');if(el)el.classList.remove('show')}

/* ── Wire all controls ── */
function wireControls(){
  $('ctrl-play').addEventListener('click',()=>cmd('play'));
  $('ctrl-prev').addEventListener('click',()=>{if(curEp>1)goEp(curEp-1)});
  $('ctrl-next').addEventListener('click',()=>{if(curEp<totalEps)goEp(curEp+1)});
  $('upnext-go').addEventListener('click',()=>{hideUpnext();goEp(curEp+1)});
  $('upnext-cancel').addEventListener('click',()=>{hideUpnext();toast('Auto next cancelled')});

  $('ctrl-autonext').addEventListener('click',function(){
    cfgAutoNext=!cfgAutoNext;ls.set('cfg_autonext',cfgAutoNext);
    const m=ls.get('macfg',{});m.autonext=cfgAutoNext;ls.set('macfg',m);
    this.classList.toggle('on',cfgAutoNext);this.querySelector('.lbl').textContent=`Auto Next ${cfgAutoNext?'ON':'OFF'}`;
    toast(`Auto Next ${cfgAutoNext?'enabled':'disabled'}`,'ok');
    if(!cfgAutoNext)hideUpnext();
  });
  $('ctrl-theater').addEventListener('click',toggleTheater);
  $('ctrl-lights').addEventListener('click',toggleLights);
  $('ctrl-shortcuts').addEventListener('click',()=>$('shortcuts-modal').classList.add('open'));
  $('shortcuts-close').addEventListener('click',()=>$('shortcuts-modal').classList.remove('open'));
  $('shortcuts-modal').addEventListener('click',e=>{if(e.target.id==='shortcuts-modal')$('shortcuts-modal').classList.remove('open')});
  $('ep-filter').addEventListener('input',e=>{
    const q=e.target.value.trim();
    document.querySelectorAll('#ep-grid [data-ep]').forEach(b=>b.classList.toggle('hidden',!!q&&!String(b.dataset.ep).includes(q)));
    if(/^\d+$/.test(q)&&+q>=1&&+q<=totalEps&&Math.floor((+q-1)/CH)!==epRange){epRange=Math.floor((+q-1)/CH);buildEpGrid()}
  });
  $('ep-filter').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=+e.target.value;if(q>=1&&q<=totalEps&&(!gateEps||q<=airedEps)){goEp(q);e.target.value='';e.target.dispatchEvent(new Event('input'))}}});
  const mode=$('ep-mode');if(mode)mode.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;epMode=b.dataset.m;mode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));buildEpGrid()});

  $('srv-select').addEventListener('change',function(){
    server=this.value;localStorage.setItem('player_server',server);
    reloadPlayer();
    const name=(SERVERS.find(s=>s.id===server)||{}).label||'Server';
    toast(`${name.replace(/[^\w ]/g,'').trim()} active`);
  });
  $('fmt-sub').addEventListener('click',()=>setFmt('sub'));
  $('fmt-dub').addEventListener('click',()=>setFmt('dub'));

  $('btn-share').addEventListener('click',async()=>{
    const url=location.href.split('#')[0];
    if(navigator.share&&isTouch){try{await navigator.share({title:document.title,url});return}catch(e){}}
    try{await navigator.clipboard.writeText(url);toast('Link copied','ok')}catch{toast('Could not copy link','err')}
  });
  $('btn-report').addEventListener('click',async function(){
    if(!animeData)return;
    this.disabled=true;
    const title=T(animeData);
    const srvName=((SERVERS.find(s=>s.id===server)||{}).label||'Unknown').replace(/[^\w ]/g,'').trim();
    const payload={content:`🚩 **Episode Report**`,embeds:[{title,description:`**Episode:** ${curEp}\n**Server:** ${srvName}\n**Audio:** ${fmt.toUpperCase()}`,color:16711680,footer:{text:`Anime ID: ${ANIME_ID}`}}]};
    try{
      await fetch('https://discord.com/api/webhooks/1521390504976187524/0PMKdVuZ2EzxW0O7nVvMPCRtLxVfLawAllKBB94kUu1ZaXnpuYaZCL8b7bXdYR9hzveA',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      toast('Report submitted — thanks!','ok');
    }catch{toast('Failed to submit report','err')}
    setTimeout(()=>{this.disabled=false},8000);
  });
  $('hdr-fav').addEventListener('click',()=>{
    favorites=ls.get('maf',[]);const id=ANIME_ID,on=favorites.includes(id);
    favorites=on?favorites.filter(x=>x!==id):[...favorites,id];ls.set('maf',favorites);
    $('hdr-fav').classList.toggle('on',!on);toast(on?'Removed from favourites':'Added to favourites',on?'info':'ok');
  });
  const dt=$('desc-toggle');if(dt)dt.addEventListener('click',function(){const d=$('anime-desc');const open=d.classList.toggle('truncated');this.textContent=open?'Show more':'Show less'});

  $('player').addEventListener('load',()=>{
    setTimeout(()=>{
      const l=$('ploading');if(l)l.classList.add('gone');
      const s=$('meta-status');if(s&&s.textContent==='Buffering'){s.textContent='Streaming';s.className='st'}
      offerResume();
    },900);
  });

  document.addEventListener('keydown',e=>{
    const tag=e.target.tagName;
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key.toLowerCase();
    if(e.key===' '){e.preventDefault();cmd('play')}
    else if(k==='n'){if(curEp<totalEps)goEp(curEp+1)}
    else if(k==='p'){if(curEp>1)goEp(curEp-1)}
    else if(k==='f'){const f=$('player');if(f&&f.requestFullscreen)f.requestFullscreen()}
    else if(k==='t')toggleTheater();
    else if(k==='l')toggleLights();
    else if(k==='d')setFmt(fmt==='sub'?'dub':'sub');
    else if(k==='h')location.href='index.html';
    else if(e.key==='Escape'){$('shortcuts-modal').classList.remove('open');hideUpnext();if(document.body.classList.contains('lights-on'))toggleLights()}
  });

  updateEpBtns();
}

function toggleTheater(){document.body.classList.toggle('theater');const on=document.body.classList.contains('theater');$('ctrl-theater').classList.toggle('on',on);toast(on?'Theater mode on':'Theater mode off');placeEpisodesPanel()}
function toggleLights(){document.body.classList.toggle('lights-on');$('ctrl-lights').classList.toggle('on',document.body.classList.contains('lights-on'))}
$('lights-overlay').addEventListener('click',()=>{if(document.body.classList.contains('lights-on'))toggleLights()});
function setFmt(f){
  if(f===fmt)return;
  fmt=f;localStorage.setItem('player_fmt',f);
  $('fmt-sub').classList.toggle('on',f==='sub');$('fmt-dub').classList.toggle('on',f==='dub');
  reloadPlayer();toast(f==='sub'?'Switched to Subtitles':'Switched to Dub');
}

/* ── Player messages ── */
function listenPlayer(){
  window.addEventListener('message',e=>{
    let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch{return}}if(!d)return;
    const s=$('meta-status');const w=$('pwrap');if(!s)return;
    let ev=null,ct=0,dur=0,paused=false;
    if(d.type==='PLAYER_EVENT'&&d.data){ev=d.data.event;ct=d.data.currentTime||0;dur=d.data.duration||0;paused=!!d.data.paused}
    else if(d.event){ev=d.event==='time'?'timeupdate':d.event==='complete'?'ended':d.event;ct=d.currentTime||d.time||0;dur=d.duration||d.total||0;paused=d.paused||false;if(d.percent!=null&&!dur)dur=ct/(d.percent/100)||0}
    if(!ev)return;
    if(ct)lastCt=ct;if(dur)lastDur=dur;
    if(ev==='play'||ev==='playing'){s.textContent='Playing';s.className='st playing';if(w)w.classList.add('playing');const l=$('ploading');if(l)l.classList.add('gone')}
    else if(ev==='pause'||ev==='paused'){s.textContent='Paused';s.className='st';if(w)w.classList.remove('playing')}
    else if(ev==='ended'||ev==='complete'){
      s.textContent='Ended';s.className='st';if(w)w.classList.remove('playing');
      markWatched(curEp);updateEpBtns();updateCwProgress(1,1);
      if(cfgAutoNext&&curEp<totalEps&&(!gateEps||curEp<airedEps))showUpnext();
    }
    else if(ev==='timeupdate'||ev==='seeked'){
      s.textContent=paused?'Paused':'Playing';s.className=paused?'st':'st playing';
      if(dur){const mt=$('meta-time');if(mt){mt.style.display='';mt.textContent=`${fmtClock(ct)} / ${fmtClock(dur)}`}}
      const now=Date.now();
      if(ct>5&&now-lastSave>5000){lastSave=now;savePos(ct,dur)}
      if(dur&&now-lastCw>10000){lastCw=now;updateCwProgress(ct,dur);if(ct/dur>.85){markWatched(curEp)}}
    }
  });
}

/* ── Suggestions ── */
async function loadSuggestions(a){
  const g=$('suggest-grid');if(!g)return;
  let items=((a.recommendations&&a.recommendations.nodes)||[]).map(n=>n.mediaRecommendation).filter(m=>m&&m.id!==ANIME_ID&&(!cfg.hideAdult||!m.isAdult));
  let sub='Recommended by AniList users';
  if(items.length<3){
    const genre=(a.genres||[])[0]||'Action';
    const more=await gql(GQL_SUGGEST,Object.assign({genre},cfg.hideAdult?{isAdult:false}:{}));
    const seen=new Set(items.map(x=>x.id));
    items=items.concat(more.filter(x=>x.id!==ANIME_ID&&!seen.has(x.id)));
    sub=`Popular ${genre} picks`;
  }
  items=items.slice(0,8);
  g.innerHTML='';const ss=$('sug-sub');if(ss)ss.textContent=items.length?sub:'';
  if(!items.length){g.innerHTML=`<div style="color:var(--muted);font-size:12.5px;grid-column:1/-1;padding:16px 0">No suggestions found.</div>`;return}
  items.forEach(s=>{
    const t=T(s);
    const card=document.createElement('div');card.className='sug-card';
    card.innerHTML=`<div class="sug-poster" style="--sc:${esc(s.coverImage.color||'')}"><img src="${esc(s.coverImage.large)}" loading="lazy" decoding="async" alt="${esc(t)}"><div class="sug-grad"></div><div class="sug-score">★ ${s.averageScore||'—'}</div></div><div class="sug-body"><div class="sug-title">${esc(t)}</div><div class="sug-sub">${s.episodes?s.episodes+' eps':'Ongoing'}</div></div>`;
    card.addEventListener('click',()=>{window.location.href=`watch?id=${s.id}&ep=1`});
    g.appendChild(card);
  });
  stagger(g);
}

/* ── History (shared with the home page) ── */
function saveHistory(a){
  const title=T(a);const studio=(a.studios&&a.studios.nodes[0]&&a.studios.nodes[0].name)||'Unknown';const ts=Date.now();
  let cw=ls.get('mcw',[]);
  const ci=cw.findIndex(x=>+x.animeId===ANIME_ID);
  const prev=ci>-1?cw[ci]:null;
  const ce={animeId:ANIME_ID,episode:curEp,title,studio,score:a.averageScore||'N/A',cover:(a.coverImage&&a.coverImage.large)||'',ts,progress:prev&&prev.episode===curEp?prev.progress||0:0};
  if(ci>-1)cw.splice(ci,1);cw.unshift(ce);if(cw.length>12)cw.length=12;
  ls.set('mcw',cw);
  let wh=ls.get('mwh',[]);
  const stamp=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  if(wh[0]&&+wh[0].animeId===ANIME_ID&&+wh[0].episode===curEp){wh[0].ts=ts;wh[0].watchedAt=stamp}
  else wh.unshift({animeId:ANIME_ID,episode:curEp,title,studio,cover:(a.coverImage&&a.coverImage.large)||'',ts,watchedAt:stamp});
  if(wh.length>60)wh.length=60;ls.set('mwh',wh);
}

/* ── Community comments embed ── */
function initComments(a){
  const cs=getComputedStyle(document.documentElement);
  const accent=cs.getPropertyValue('--accent').trim()||'#ff7a1a';
  window.theAnimeCommunityConfig={
    MAL_ID:String(a.idMal||''),
    AniList_ID:String(a.id||''),
    episodeChapterNumber:String(curEp),
    mediaType:'anime',
    removeBorder:'true',
    removePadding:'true',
    colorScheme:{
      primaryColor:accent,
      backgroundColor:'transparent',
      dropDownTextColor:'#f0eee8',
      strongTextColor:'#f0eee8',
      primaryTextColor:'#c9c7cf',
      secondaryTextColor:'#8b8a99',
      iconColor:'#8b8a99',
      accentColor:'rgba(255,255,255,.08)'
    }
  };
  /* embed.js only runs once per page (it sets a loaded flag), so later episodes remount the widget via its reload() */
  if(window.theAnimeCommunity&&typeof window.theAnimeCommunity.reload==='function'){window.theAnimeCommunity.reload();return}
  if($('anime-community-script'))return;
  const sc=document.createElement('script');sc.src='https://theanimecommunity.com/embed.js';sc.id='anime-community-script';sc.async=true;document.head.appendChild(sc);
}

document.addEventListener('pointerdown',e=>{
  if(!cfg.fx)return;const b=e.target.closest&&e.target.closest('.btn');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,el=document.createElement('span');
  el.className='ripple';el.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(el);el.addEventListener('animationend',()=>el.remove());
},{passive:true});
(function(){
  const b=document.body;let t=null;
  const set=v=>b.classList.toggle('anim-paused',v);
  if(!isTouch)addEventListener('scroll',()=>{if(!b.classList.contains('anim-paused'))set(true);clearTimeout(t);t=setTimeout(()=>set(document.hidden),160)},{passive:true});
  document.addEventListener('visibilitychange',()=>set(document.hidden));
})();

/* ── scroll chrome ── */
(function(){
  const hdr=document.querySelector('header'),tt=$('to-top');let last=0;
  addEventListener('scroll',()=>{const y=scrollY;if((y>40)!==(last>40))hdr.classList.toggle('scrolled',y>40);if((y>700)!==(last>700))tt.classList.toggle('show',y>700);last=y},{passive:true});
  tt.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
})();

/* ── Boot ── */
const ERR=(h,p)=>`<div class="error-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><h2>${h}</h2><p>${p}</p><a href="index.html" class="btn btn-primary" style="margin-top:12px;text-decoration:none">← Back to Home</a></div>`;
if(!ANIME_ID){
  $('root').innerHTML=ERR('Nothing to Play','Go back and choose something to watch.');
}else{
  gql(GQL,{id:ANIME_ID}).then(data=>{
    if(!data.length){$('root').innerHTML=ERR('Anime Not Found','This title may have been removed from AniList, or AniList is unreachable right now.');return}
    buildPage(data[0]);
    toast(`Now playing: ${T(data[0])}`,'ok');
  });
}

// ── Protection ──
document.addEventListener('contextmenu',e=>{e.preventDefault();return false});
document.addEventListener('keydown',e=>{
  if(e.keyCode===123||e.key==='F12'){e.preventDefault();e.stopPropagation();return false}
  if((e.metaKey||e.ctrlKey)&&e.altKey&&['i','I','u','U'].includes(e.key)){e.preventDefault();e.stopPropagation();return false}
  if(e.ctrlKey&&e.shiftKey&&['i','I','c','C','j','J','k','K'].includes(e.key)){e.preventDefault();e.stopPropagation();return false}
},true);
setInterval(()=>console.clear(),1000);
const noop=()=>{};console.log=console.warn=console.error=console.debug=console.info=noop;
</script>
